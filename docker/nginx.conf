# serves ./tiles for local development with the same headers the tiles get in s3
server {
    listen 80;
    root /usr/share/nginx/html;

    location ~ \.pbf$ {
        types { }
        default_type application/x-protobuf;
        # tippecanoe gzips every tile, so tell clients to decompress them
        add_header Content-Encoding gzip;
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        add_header Access-Control-Allow-Origin *;
    }
}
